services:
  api:
    build:
      context: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - PIXELPRO_MAX_UPLOAD_MB=20
      - PIXELPRO_MAX_BATCH=50
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
